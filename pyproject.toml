[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt-nso"
version = "0.1.0"
description = "CLI for Malta National Statistics Office (NSO) open data via the IRIS SDMX API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Jean Galea" }]
keywords = ["malta", "nso", "sdmx", "statistics", "cli", "open-data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jgalea/mt-nso"
Issues = "https://github.com/jgalea/mt-nso/issues"

[project.scripts]
mt-nso = "mt_nso.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mt_nso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
